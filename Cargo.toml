[package]
name = "garage-door"
version = "0.4.2"
edition = "2024"
description = "A simple OIDC provider, for demo purposes"

authors = ["Jens Reimann <ctron@dentrassi.de>"]
license = "Apache-2.0"
repository = "https://github.com/ctron/garage-door"
categories = ["authentication", "web-programming"]
keywords = ["oidc", "server", "issuer"]
readme = "README.md"
rust-version = "1.89"

[dependencies]
actix-cors = "0.7"
actix-web = { version = "4.20", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "http2", "unicode", "compat", "ws"] } # Keep the default feature set except unused cookie support.
anyhow = "1"
biscuit = "0.7.0"
clap = { version = "4.5.4", features = ["derive", "env"], optional = true }
hide = { version = "0.1.5", features = ["serde", "schemars"] }
log = "0.4.21"
mime = "0.3.17"
oauth2 = "5.0.0-alpha.4"
openidconnect = { version = "4.1", default-features = false }
oxide-auth = "0.6.1"
oxide-auth-actix = "0.3.0"
rand = "0.10"
ring = "0.17"
rsa = "0.10"
schemars = { version = "0.8", features = ["derive", "url"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"], optional = true }
serde_json = "1"
strum = { version = "0.27.1", features = ["derive"] }
thiserror = "2"
tokio = "1"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["tracing-log", "ansi", "env-filter"], optional = true }
url = "2.5.4"

[features]
default = []
server = [
    "clap",
    "tokio/full",
    "tracing-subscriber",
]

[[bin]]
name = "server"
required-features = ["server", "serde-saphyr"]

[patch.crates-io]
#oxide-auth = { path = "../oxide-auth/oxide-auth" }
#oxide-auth = { git = "https://github.com/ctron/oxide-auth", rev = "cd0c79c48a702ea6bb0b05e95e9eddcba8f6c77f" }
